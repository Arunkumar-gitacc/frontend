name: Frontend CI

on:
  push:
    branches:
      - demo

env:
  REGISTRY: arunkumar885
  IMAGE_NAME: frontend
  VERSION: v1.0.${{ github.run_number }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:frontend-prod-${VERSION} .

      - name: Push Docker Image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:frontend-prod-${VERSION}

      - name: Print Image Tag
        run: echo "Image pushed -> $REGISTRY/$IMAGE_NAME:frontend-prod-${VERSION}"


