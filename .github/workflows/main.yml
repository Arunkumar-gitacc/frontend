name: Frontend Build & Push

on:
  push:
    branches:
      - dev
      - test
      - demo
      - prod

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4
# ---------------------------------------------------------
      # 🆕 ADDED: UNIT TESTING STEPS
      # ---------------------------------------------------------
      # 2️⃣ Set up Node.js runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3️⃣ Install dependencies & run React unit tests
      - name: Run Unit Tests
        run: |
          npm ci
          npm test -- --watchAll=false --passWithNoTests
      # ---------------------------------------------------------



      # 2️⃣ Extract branch name
      - name: Set branch name
        run: |
          echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      # 3️⃣ Set image tag (branch + short sha)
      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${BRANCH_NAME}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 4️⃣ Login to Docker Hub
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # 5️⃣ Build frontend image
      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/frontend:${{ env.IMAGE_TAG }} \
            .

      # 6️⃣ Push frontend image
      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/frontend:${{ env.IMAGE_TAG }}

      # 7️⃣ Log success
      - name: Success message
        run: |
          echo "✅ Frontend image pushed:"
          echo "${{ secrets.DOCKER_USERNAME }}/frontend:${{ env.IMAGE_TAG }}"
